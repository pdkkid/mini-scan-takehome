services:

  # Starts the P/S emulator
  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:316.0.0-emulators
    ports:
      - "8085:8085"
    entrypoint: gcloud beta emulators pubsub start --project test-project --host-port 0.0.0.0:8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://pubsub:8085"]
      interval: 5s
      timeout: 10s
      retries: 3

  # Creates a topic
  mk-topic:
    image: alpine/httpie
    depends_on:
      pubsub:
        condition: service_healthy
    command: PUT http://pubsub:8085/v1/projects/test-project/topics/scan-topic

  # Creates a subscription
  mk-subscription:
    image: alpine/httpie
    depends_on:
      mk-topic:
        condition: service_completed_successfully
    command: PUT http://pubsub:8085/v1/projects/test-project/subscriptions/scan-sub topic=projects/test-project/topics/scan-topic --ignore-stdin

  # Creates the dead letter queue topic
  mk-dlq-topic:
    image: alpine/httpie
    depends_on:
      pubsub:
        condition: service_healthy
    command: PUT http://pubsub:8085/v1/projects/test-project/topics/scan-dlq

  # Creates a subscription for inspecting DLQ messages
  mk-dlq-subscription:
    image: alpine/httpie
    depends_on:
      mk-dlq-topic:
        condition: service_completed_successfully
    command: PUT http://pubsub:8085/v1/projects/test-project/subscriptions/scan-dlq-sub topic=projects/test-project/topics/scan-dlq --ignore-stdin

  # Runs the "scanner"
  scanner:
    depends_on:
      mk-topic:
        condition: service_completed_successfully
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: test-project
    build:
      context: .
      dockerfile: ./cmd/scanner/Dockerfile

  # PostgreSQL — shared storage backend for the scan processor
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scans
      POSTGRES_USER: processor
      POSTGRES_PASSWORD: processor
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processor -d scans"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs the scan result processor
  processor:
    depends_on:
      mk-subscription:
        condition: service_completed_successfully
      mk-dlq-topic:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: test-project
      POSTGRES_URL: "postgres://processor:processor@postgres:5432/scans?sslmode=disable"
    build:
      context: .
      dockerfile: ./cmd/processor/Dockerfile
    command: ["/app/processor", "-store", "postgres"]
    ports:
      - "8080:8080"   # /metrics (Prometheus) and /healthz

  # Scrapes processor metrics and makes them queryable
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - processor

  # Grafana — pre-provisioned datasource + dashboard; open http://localhost:3000
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg-data:
