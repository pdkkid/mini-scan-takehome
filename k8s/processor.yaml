# Processor — consumes scan results from Pub/Sub and persists them to PostgreSQL.
# Exposes /metrics (Prometheus) and /healthz (readiness + liveness) on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app: processor
    component: mini-scan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
        component: mini-scan
      # Standard Prometheus annotations for service-discovery-based scraping.
      # Even though we use static config here, including these makes the
      # manifest production-ready for clusters running the Prometheus Operator.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: processor
          image: processor
          args:
            - "-store"
            - "postgres"
          env:
            - name: PUBSUB_EMULATOR_HOST
              value: "pubsub:8085"
            - name: PUBSUB_PROJECT_ID
              value: "test-project"
            - name: POSTGRES_URL
              value: "postgres://processor:processor@postgres:5432/scans?sslmode=disable"
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          # Readiness: the processor is ready when both the Postgres store and
          # the Pub/Sub subscription are reachable. /healthz checks both.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness: same endpoint, but with a longer interval and higher
          # failure threshold. A transient pubsub blip should not restart the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 1m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: processor
  labels:
    app: processor
    component: mini-scan
spec:
  selector:
    app: processor
  ports:
    - port: 8080
      targetPort: 8080
      name: metrics
      protocol: TCP
