name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Catch go.mod / go.sum drift — a CI-only tidy check.
      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scans
          POSTGRES_USER: processor
          POSTGRES_PASSWORD: processor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U processor -d scans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race detector on)
        env:
          POSTGRES_URL: "postgres://processor:processor@localhost:5432/scans?sslmode=disable"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Print coverage summary
        run: go tool cover -func=coverage.out

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build processor binary
        run: CGO_ENABLED=0 go build ./cmd/processor

      - name: Build scanner binary
        run: CGO_ENABLED=0 go build ./cmd/scanner

      - uses: docker/setup-buildx-action@v3

      - name: Build processor Docker image
        run: docker build -f cmd/processor/Dockerfile -t processor:ci .

      - name: Build scanner Docker image
        run: docker build -f cmd/scanner/Dockerfile -t scanner:ci .